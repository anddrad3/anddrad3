<svg xmlns="http://www.w3.org/2000/svg" width="680" height="150" viewBox="0 0 680 150">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc8e"/>
      <stop offset=".45" stop-color="#d4a94f"/>
      <stop offset=".55" stop-color="#c39338"/>
      <stop offset="1" stop-color="#8c6424"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a531c"/>
      <stop offset="1" stop-color="#3f2a0c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="screw" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#fbeab5"/>
      <stop offset="1" stop-color="#6e4a14"/>
    </radialGradient>
  </defs>
  <!-- sombra -->
  <rect x="14" y="18" width="652" height="122" rx="16" fill="#000" opacity=".22"/>
  <!-- placa -->
  <rect x="8" y="8" width="664" height="124" rx="16" fill="url(#edge)"/>
  <rect x="12" y="10" width="656" height="118" rx="14" fill="url(#brass)"/>
  <rect x="26" y="22" width="628" height="94" rx="9" fill="none" stroke="#7a531c" stroke-width="2" opacity=".75"/>
  <rect x="30" y="26" width="620" height="86" rx="7" fill="none" stroke="#fff3c9" stroke-width="1" opacity=".55"/>
  <rect x="12" y="10" width="656" height="118" rx="14" fill="url(#sheen)"/>
  <!-- parafusos -->
  <g>
    <circle cx="46" cy="69" r="8" fill="url(#screw)" stroke="#5a3d10"/>
    <path d="M41 69h10" stroke="#5a3d10" stroke-width="2"/>
    <circle cx="634" cy="69" r="8" fill="url(#screw)" stroke="#5a3d10"/>
    <path d="M629 69h10" stroke="#5a3d10" stroke-width="2"/>
  </g>
  <!-- texto gravado -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="340" y="70" font-size="34" letter-spacing="9" fill="#fff3c9" opacity=".6">MEU PORTFÓLIO</text>
    <text x="340" y="68" font-size="34" letter-spacing="9" fill="#3b2508">MEU PORTFÓLIO</text>
    <text x="340" y="101" font-size="19" font-style="italic" fill="#fff3c9" opacity=".55">clique e abra o livro  →</text>
    <text x="340" y="100" font-size="19" font-style="italic" fill="#4a2f0c">clique e abra o livro  →</text>
